<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부동산 매물 호가 모니터링</title>
  <style>
    body { font-family: -apple-system, "Noto Sans KR", sans-serif; margin: 0; background: #f5f6f8; color: #222; }
    header { background: #1f3a5f; color: #fff; padding: 16px 20px; }
    main { max-width: 960px; margin: 20px auto; padding: 0 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #e3e5e8; text-align: left; }
    th { background: #eef1f5; }
    .empty { text-align: center; color: #888; }
  </style>
</head>
<body>
  <header>
    <h1>부동산 매물 호가 모니터링</h1>
  </header>
  <main>
    <table>
      <thead>
        <tr><th>단지명</th><th>면적(㎡)</th><th>층</th><th>호가(만원)</th><th>변동</th><th>확인일</th></tr>
      </thead>
      <tbody>
        <tr><td colspan="6" class="empty">등록된 매물이 없습니다.</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
