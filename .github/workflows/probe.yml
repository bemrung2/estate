name: probe
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  hogangnono:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: bundle
        run: |
          curl -sS -m 30 "https://hogangnono.com/search?q=x" -o page.html
          JS=$(grep -o 'https://static.hogangnono.com/dist/[^"]*desktop.js' page.html | head -1)
          curl -sS -m 60 --compressed "$JS" -o b.js; wc -c b.js
          node -e '
          const s = require("fs").readFileSync("b.js", "utf8");
          const seen = new Set();
          for (const m of s.matchAll(/["\x27`]([^"\x27`\\\n]{3,140})["\x27`]/g)) {
            const t = m[1];
            if (/^\/?(api\/|apt\/|search)|\/api\/v\d|searches|autocomplete|\/apt\//.test(t)) seen.add(t);
          }
          console.log([...seen].sort().slice(0, 220).join("\n"));
          for (const k of ["searches", "autocomplete", "/search"]) {
            let i = -1, n = 0;
            while ((i = s.indexOf(k, i + 1)) >= 0 && n++ < 6) console.log("@" + k, JSON.stringify(s.slice(Math.max(0, i - 110), i + 130)));
          }'
