name: probe
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  hogangnono:
    runs-on: ubuntu-latest
    steps:
      - name: bundle
        run: |
          curl -sS -m 30 "https://hogangnono.com/search?q=x" -o page.html
          JS=$(grep -o 'https://static.hogangnono.com/dist/[^"]*desktop.js' page.html | head -1)
          echo "bundle $JS"
          curl -sS -m 60 "$JS" -o b.js; wc -c b.js
          echo "--- api paths"; grep -o '"/api/[A-Za-z0-9/_${}.:?=&-]*"' b.js | sort -u | head -150
          echo "--- search-ish"; grep -o '.\{80\}search.\{120\}' b.js | grep -i "api\|query\|keyword" | head -25
          echo "--- apt url"; grep -o '.\{60\}"/apt/.\{80\}' b.js | head -10
