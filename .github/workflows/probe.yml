name: probe
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  hogangnono:
    runs-on: ubuntu-latest
    steps:
      - name: bundle
        run: |
          curl -sS -m 30 "https://hogangnono.com/search?q=x" -o page.html
          JS=$(grep -o 'https://static.hogangnono.com/dist/[^"]*desktop.js' page.html | head -1)
          echo "bundle $JS"
          curl -sS -m 60 "$JS" -o b.js; wc -c b.js
          echo "--- api-ish"; grep -oE '[a-zA-Z0-9_./-]*api/v?[0-9]*/?[a-zA-Z0-9_./${}-]*' b.js | sort | uniq -c | sort -rn | head -60
          echo "--- search"; grep -oE '.{0,70}(searches|/search|autocomplete|suggest)[^,;]{0,90}' b.js | sort -u | head -40
          echo "--- apt"; grep -oE '.{0,50}"?/apt/[^,;]{0,70}' b.js | sort -u | head -25
          echo "--- try"; for u in "api/v2/searches/keyword?query=%ED%97%AC%EB%A6%AC%EC%98%A4%EC%8B%9C%ED%8B%B0" "api/v2/searches?keyword=%ED%97%AC%EB%A6%AC%EC%98%A4%EC%8B%9C%ED%8B%B0"; do curl -sS -m 15 "https://hogangnono.com/$u" | head -c 400; echo; done
